[project]
name = "grapevine-mcmc"
version = "0.3.0"
description = "Faster Hamiltonian trajectories for problems with guesses, using Blackjax"
authors = [
    {name = "Teddy Groves", email = "tedgro@dtu.dk"},
]
dependencies = [
    "blackjax>=1.6.2",
    "jax>=0.4.38",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/grapevine"]

[tool.ruff]
line-length = 80

[dependency-groups]
dev = [
    "chex>=0.1.88",
    "optimistix>=0.0.10",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]
benchmarks = [
    "arviz>=0.20.0,<1.0.0",
    "cmdstanpy>=1.2.5",
    "diffrax>=0.7.0",
    "enzax @ git+https://github.com/dtu-qmcm/enzax.git#main",
    "equinox>=0.11.8",
    "fastprogress>=1.1.5",
    "ipython>=9.12.0",
    "lineax>=0.0.7",
    "matplotlib>=3.10.0",
    "numpy>=2.0",
    "optimistix>=0.0.10",
    "polars>=1.19.0",
    "tqdm>=4.67.1",
]
